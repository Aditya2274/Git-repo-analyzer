name: Docker CI/CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2️⃣ Log in to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3️⃣ Generate version tag automatically
      - name: Set Version
        id: version
        run: echo "VERSION=1.0.${{ github.run_number }}" >> $GITHUB_ENV

      # 4️⃣ Build Docker Image
      - name: Build Docker Image
        run: |
          docker build -t adityaashok2274/git-repo-analyzer:${{ env.VERSION }} .
          docker tag adityaashok2274/git-repo-analyzer:${{ env.VERSION }} adityaashok2274/git-repo-analyzer:latest

      # 5️⃣ Push Image to Docker Hub
      - name: Push Docker Image
        run: |
          docker push adityaashok2274/git-repo-analyzer:${{ env.VERSION }}
          docker push adityaashok2274/git-repo-analyzer:latest

  validate-image:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10  # This will auto-kill the job if it exceeds 10 mins
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull Latest Image
        run: docker pull adityaashok2274/git-repo-analyzer:latest

      # 6️⃣ Run Analyzer in CI (Updated to pass GROQ_API_KEY to Docker)
      - name: Run Analyzer in CI
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        shell: bash
        run: |
          docker run --rm \
            -e GROQ_API_KEY="$GROQ_API_KEY" \
            -v "$PWD":/repo \
            adityaashok2274/git-repo-analyzer:latest

      # 7️⃣ Upload Analysis Reports
      - name: Upload Analysis Reports
        uses: actions/upload-artifact@v4
        with:
          name: git-analyzer-report
          path: reports/
          retention-days: 14