name: Docker CI/CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2️⃣ Log in to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3️⃣ Generate version tag automatically
      - name: Set Version
        id: version
        run: echo "VERSION=1.0.${{ github.run_number }}" >> $GITHUB_ENV

      # 4️⃣ Build Docker Image
      - name: Build Docker Image
        run: |
          docker build -t adityaashok2274/git-repo-analyzer:${{ env.VERSION }} .
          docker tag adityaashok2274/git-repo-analyzer:${{ env.VERSION }} adityaashok2274/git-repo-analyzer:latest

      # 5️⃣ Push Image to Docker Hub
      - name: Push Docker Image
        run: |
          docker push adityaashok2274/git-repo-analyzer:${{ env.VERSION }}
          docker push adityaashok2274/git-repo-analyzer:latest

  validate-image:
    needs: build-and-push
    strategy:
      matrix:
        # Test on Linux and Windows runners
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10  # This will auto-kill the job if it exceeds 10 mins
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull Latest Image
        run: docker pull adityaashok2274/git-repo-analyzer:latest

      - name: Run Analyzer in CI
        shell: bash
        run: |
          # Use MSYS_NO_PATHCONV=1 to prevent Git Bash from aggressively rewriting paths
          export MSYS_NO_PATHCONV=1
          docker run --rm \
            -v "$PWD":/repo \
            adityaashok2274/git-repo-analyzer:latest
