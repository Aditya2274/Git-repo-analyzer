name: Docker CI/CD

on:
  push:
    branches: [ main ,feat/deterministic-metrics,integration/release-v67 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 1️⃣ Checkout repository with full Git history for analyzer execution
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Generate version tag automatically
      - name: Set Version
        id: version
        run: echo "VERSION=1.0.${{ github.run_number }}" >> $GITHUB_ENV

      # 3️⃣ Build Docker Image locally with versioned and latest tags
      - name: Build Docker Image
        run: |
          docker build -t adityaashok2274/git-repo-analyzer:${{ env.VERSION }} .
          docker tag adityaashok2274/git-repo-analyzer:${{ env.VERSION }} adityaashok2274/git-repo-analyzer:latest

      # 4️⃣ Validate locally built image BEFORE publishing (fails workflow if broken)
      - name: Run Analyzer in CI (Validation Before Publish)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        timeout-minutes: 10
        shell: bash
        run: |
          docker run --rm \
            -e GROQ_API_KEY="$GROQ_API_KEY" \
            -v "$PWD":/repo \
            adityaashok2274/git-repo-analyzer:latest

      # 5️⃣ Upload Analysis Reports
      - name: Upload Analysis Reports
        uses: actions/upload-artifact@v4
        with:
          name: git-analyzer-report
          path: reports/
          retention-days: 14

      # 6️⃣ Log in to Docker Hub (strictly AFTER validation succeeds)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 7️⃣ Push Docker Image (strictly AFTER validation succeeds)
      - name: Push Docker Image
        run: |
          docker push adityaashok2274/git-repo-analyzer:${{ env.VERSION }}
          docker push adityaashok2274/git-repo-analyzer:latest
