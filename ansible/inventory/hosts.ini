# Canonical Ansible Inventory for Git Repository Analyzer Fleet
# Pre-provisioning baseline template.
#
# When live EC2 instances are provisioned under Boundary B via Terraform, run:
#   bash ansible/scripts/sync_terraform_inventory.sh
# to dynamically synchronize public/private IP addresses from Terraform state.

[puppet_server]
puppet-server ansible_host=127.0.0.1 private_ip=10.0.0.10

[application]
app-server ansible_host=127.0.0.1 private_ip=10.0.0.11

[cicd]
cicd-server ansible_host=127.0.0.1 private_ip=10.0.0.12

[puppet_agents:children]
application
cicd
