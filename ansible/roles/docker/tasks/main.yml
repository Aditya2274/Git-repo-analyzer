---
# Main orchestrator for docker role (EC2 3: CI/CD & Analysis Server)

- name: Execute preflight checks for Docker installation
  ansible.builtin.include_tasks: preflight.yml

- name: Configure official Docker APT repository and keyring
  ansible.builtin.include_tasks: repository.yml

- name: Install official Docker Engine and Compose plugin packages
  ansible.builtin.include_tasks: install.yml

- name: Configure Docker daemon settings and security controls
  ansible.builtin.include_tasks: config.yml

- name: Manage containerd and Docker systemd services
  ansible.builtin.include_tasks: service.yml

- name: Manage Docker group membership and user permissions
  ansible.builtin.include_tasks: users.yml
