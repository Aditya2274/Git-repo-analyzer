---
# Docker and containerd systemd service management

- name: Manage containerd systemd service
  ansible.builtin.systemd:
    name: "{{ docker_containerd_service_name | default('containerd') }}"
    state: "{{ docker_service_state | default('started') }}"
    enabled: "{{ docker_service_enabled | default(true) }}"

- name: Manage Docker daemon systemd service
  ansible.builtin.systemd:
    name: "{{ docker_service_name | default('docker') }}"
    state: "{{ docker_service_state | default('started') }}"
    enabled: "{{ docker_service_enabled | default(true) }}"
