---
# Default variables for docker role (EC2 3 - CI/CD & Analysis Server)

docker_role: docker

# Target OS and instance constraints
docker_target_distribution: "Ubuntu"
docker_target_release: "24.04"
docker_target_group: "cicd"
docker_target_host: "cicd-server"

# Repository and prerequisite configuration
docker_prerequisite_packages:
  - ca-certificates
  - curl
docker_keyring_dir: "/etc/apt/keyrings"
docker_keyring_path: "/etc/apt/keyrings/docker.asc"
docker_gpg_url: "https://download.docker.com/linux/ubuntu/gpg"
docker_apt_arch: "{{ 'amd64' if ansible_architecture in ['x86_64', 'amd64'] else 'arm64' if ansible_architecture in ['aarch64', 'arm64'] else ansible_architecture }}"
docker_apt_release: "{{ ansible_distribution_release | default('noble') }}"
docker_apt_repo_url: "https://download.docker.com/linux/ubuntu"
docker_apt_repo_filename: "docker"

# Package selection (official Docker CE components)
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
docker_packages_state: "present"

# Daemon configuration (/etc/docker/daemon.json)
docker_daemon_config_dir: "/etc/docker"
docker_daemon_config_file: "/etc/docker/daemon.json"
docker_daemon_config:
  log-driver: "json-file"
  log-opts:
    max-size: "10m"
    max-file: "3"
  default-ulimits:
    nofile:
      Name: "nofile"
      Hard: 64000
      Soft: 64000

# Service lifecycle management
docker_service_name: "docker"
docker_containerd_service_name: "containerd"
docker_service_state: "started"
docker_service_enabled: true

# User and group management (security sensitive)
docker_group: "docker"
docker_users: []
