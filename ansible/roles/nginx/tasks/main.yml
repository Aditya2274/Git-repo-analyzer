---
- name: Install NGINX
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true

- name: Deploy NGINX configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/git-repo-analyzer
    owner: root
    group: root
    mode: "0644"
  notify: Restart NGINX

- name: Enable Git Repository Analyzer site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/git-repo-analyzer
    dest: /etc/nginx/sites-enabled/git-repo-analyzer
    state: link
  notify: Restart NGINX

- name: Remove default NGINX site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Restart NGINX

- name: Ensure NGINX is enabled and running
  ansible.builtin.systemd_service:
    name: nginx
    state: started
    enabled: true