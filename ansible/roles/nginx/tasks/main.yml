---
# Main orchestrator for nginx role (EC2 2: Application & Monitoring Server)

- name: Execute preflight checks for NGINX installation
  ansible.builtin.include_tasks: preflight.yml

- name: Install official Ubuntu NGINX web server package
  ansible.builtin.include_tasks: install.yml

- name: Deploy baseline NGINX configuration and security controls
  ansible.builtin.include_tasks: config.yml

- name: Manage NGINX systemd service lifecycle
  ansible.builtin.include_tasks: service.yml

- name: Verify NGINX installation and service status
  ansible.builtin.include_tasks: verify.yml
