---
# Default variables for common role

apt_cache_valid_time: 3600
apt_lock_timeout: 300
system_timezone: "Etc/UTC"
swap_size_mb: 0

common_packages:
  - curl
  - wget
  - git
  - unzip
  - ca-certificates
  - gnupg
  - htop
  - jq
  - software-properties-common
  - systemd-timesyncd
  - net-tools
