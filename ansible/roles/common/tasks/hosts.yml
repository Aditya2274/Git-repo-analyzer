---
- name: Validate that all fleet private IPs are defined in inventory
  ansible.builtin.assert:
    that:
      - hostvars['puppet-server']['private_ip'] is defined
      - hostvars['app-server']['private_ip'] is defined
      - hostvars['cicd-server']['private_ip'] is defined
      - hostvars['puppet-server']['private_ip'] | length > 0
      - hostvars['app-server']['private_ip'] | length > 0
      - hostvars['cicd-server']['private_ip'] | length > 0
    fail_msg: >
      Fleet private IPs must be defined for all three instances in inventory
      (derived from Terraform outputs via sync_terraform_inventory.sh).

- name: Configure fleet private DNS entries in /etc/hosts
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE MANAGED FLEET HOSTS"
    block: |
      {{ hostvars['puppet-server']['private_ip'] }} {{ puppet_server_fqdn }} {{ puppet_server_hostname }} puppet
      {{ hostvars['app-server']['private_ip'] }} {{ app_server_fqdn }} {{ app_server_hostname }}
      {{ hostvars['cicd-server']['private_ip'] }} {{ cicd_server_fqdn }} {{ cicd_server_hostname }}
    state: present
