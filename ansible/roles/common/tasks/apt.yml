---
- name: Wait for background APT or unattended-upgrades locks to release safely
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import fcntl, os, sys, time

        timeout = int(sys.argv[1])
        start = time.time()
        lock_files = sys.argv[2:] or ["/var/lib/dpkg/lock-frontend", "/var/lib/dpkg/lock", "/var/lib/apt/lists/lock"]
        pkg_mgr_names = {
            "apt",
            "apt-get",
            "aptitude",
            "dpkg",
            "dpkg-deb",
            "unattended-upgrade",
            "apt.systemd.daily",
        }
        interpreters = {"sh", "bash", "dash"}

        def get_ancestor_pids():
            ancestors = set()
            cur = os.getpid()
            while cur and cur > 1 and cur not in ancestors:
                ancestors.add(cur)
                try:
                    with open(f"/proc/{cur}/stat", "r") as sf:
                        rest = sf.read().rsplit(")", 1)[1].split()
                        cur = int(rest[1])
                except Exception:
                    break
            return ancestors

        def find_running_pkg_mgr():
            ancestors = get_ancestor_pids()
            for entry in os.listdir("/proc"):
                if not entry.isdigit():
                    continue
                pid = int(entry)
                if pid in ancestors:
                    continue
                try:
                    with open(f"/proc/{pid}/comm", "r") as cf:
                        comm = cf.read().strip()
                    with open(f"/proc/{pid}/cmdline", "rb") as clf:
                        raw_args = clf.read().split(b"\x00")
                    args = [a.decode("utf-8", errors="replace") for a in raw_args if a]
                except Exception:
                    continue
                if not args:
                    continue

                exe = os.path.basename(args[0])
                matched = exe in pkg_mgr_names or (comm in pkg_mgr_names and comm != "unattended-upgrade")
                if not matched and (exe in interpreters or exe.startswith("python")):
                    for arg in args[1:]:
                        if arg == "-c":
                            break
                        if arg.startswith("-"):
                            continue
                        if os.path.basename(arg) in pkg_mgr_names:
                            matched = True
                        break
                if matched:
                    return f"{pid} {' '.join(args)}"
            return None

        while True:
            contended_lock = None
            for lf in lock_files:
                if not os.path.exists(lf):
                    continue
                fd = None
                try:
                    fd = open(lf, "a+")
                    # Test POSIX record lock (F_SETLK F_WRLCK) via lockf without blocking
                    fcntl.lockf(fd, fcntl.LOCK_EX | fcntl.LOCK_NB)
                    fcntl.lockf(fd, fcntl.LOCK_UN)
                except (BlockingIOError, PermissionError, OSError):
                    contended_lock = lf
                finally:
                    if fd is not None:
                        try:
                            fd.close()
                        except Exception:
                            pass
                if contended_lock:
                    break

            # Check running processes as supplemental verification without killing
            running_proc = None
            try:
                running_proc = find_running_pkg_mgr()
            except Exception:
                pass

            if not contended_lock and not running_proc:
                print("All APT/dpkg POSIX locks are clear.")
                sys.exit(0)

            elapsed = time.time() - start
            if elapsed >= timeout:
                msg = f"ERROR: Timed out after {timeout}s waiting for APT POSIX locks to release.\n"
                if contended_lock:
                    msg += f"Active file lock contention detected on: {contended_lock}\n"
                if running_proc:
                    msg += f"Active process detected: {running_proc}\n"
                sys.stderr.write(msg)
                sys.exit(1)

            print(f"APT lock contention active ({contended_lock or running_proc}); waiting... ({int(elapsed)}s/{timeout}s)")
            time.sleep(5)
      - "{{ apt_lock_timeout | default(300) }}"
  register: apt_lock_wait
  changed_when: false
  failed_when: apt_lock_wait.rc != 0

- name: Update APT package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: "{{ apt_cache_valid_time | default(3600) }}"
    lock_timeout: "{{ apt_lock_timeout | default(300) }}"
