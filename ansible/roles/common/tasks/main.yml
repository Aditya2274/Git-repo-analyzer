---
# Common bootstrap tasks executed across all EC2 nodes in the fleet

- name: Handle APT locks and package cache
  ansible.builtin.import_tasks: apt.yml

- name: Configure timezone and system clock synchronization
  ansible.builtin.import_tasks: time.yml

- name: Install essential baseline system utilities
  ansible.builtin.import_tasks: packages.yml

- name: Configure private DNS hostname resolution via /etc/hosts
  ansible.builtin.import_tasks: hosts.yml

- name: Configure virtual memory swapfile
  ansible.builtin.import_tasks: swap.yml
