---
# Puppet Agent package installation and binary verification

- name: Enforce official apt.puppet.com origin for puppet-agent installation candidate
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import os, re, subprocess, sys
        from urllib.parse import urlparse

        pkg = sys.argv[1]
        expected_host = sys.argv[2]
        env = os.environ.copy()
        env["LC_ALL"] = "C"

        res = subprocess.run(["apt-cache", "policy", pkg], capture_output=True, text=True, env=env)
        if res.returncode != 0:
            sys.stderr.write(f"apt-cache policy failed for {pkg}: {res.stderr}\n")
            sys.exit(1)

        candidate = None
        in_table = False
        current_ver = None
        origins_by_ver = {}

        for raw_line in res.stdout.splitlines():
            stripped = raw_line.strip()
            if stripped.startswith("Candidate:"):
                candidate = stripped.split(":", 1)[1].strip()
                continue
            if stripped.startswith("Version table:"):
                in_table = True
                continue
            if not in_table or not stripped:
                continue

            work = stripped[3:].strip() if stripped.startswith("***") else stripped
            parts = work.split()
            if not parts:
                continue

            if len(parts) >= 2 and re.match(r"^[+-]?\d+$", parts[0]) and not re.match(r"^[+-]?\d+$", parts[1]):
                if current_ver is not None:
                    origins_by_ver.setdefault(current_ver, []).append((parts[1], parts[2] if len(parts) >= 3 else "", parts[-1]))
            else:
                current_ver = parts[0]

        if not candidate or candidate == "(none)":
            sys.stderr.write(f"ERROR: No installation candidate found for {pkg}.\n{res.stdout}\n")
            sys.exit(1)

        origins = origins_by_ver.get(candidate, [])
        non_dpkg_origins = [o for o in origins if o[0] != "/var/lib/dpkg/status"]
        if not non_dpkg_origins:
            sys.stderr.write(
                f"ERROR: Candidate {pkg}={candidate} has no active repository origin (found {origins}).\n{res.stdout}\n"
            )
            sys.exit(1)

        invalid_origins = []
        for uri, suite_comp, pkg_type in non_dpkg_origins:
            parsed = urlparse(uri)
            suite = suite_comp.split("/", 1)[0]
            if parsed.scheme not in ("http", "https") or parsed.hostname != expected_host or suite != "noble" or pkg_type != "Packages":
                invalid_origins.append((uri, suite_comp, pkg_type))

        if invalid_origins:
            sys.stderr.write(
                f"ERROR: Candidate {pkg}={candidate} originates from disallowed source/suite {invalid_origins}, "
                f"expected exclusively HTTP/HTTPS '{expected_host}' with suite 'noble'.\n{res.stdout}\n"
            )
            sys.exit(1)

        print(f"Verified {pkg} candidate {candidate} originates from {expected_host}")
      - "{{ puppet_agent_package_name | default('puppet-agent') }}"
      - "{{ puppet_apt_origin_host | default('apt.puppet.com') }}"
  register: puppet_agent_candidate_check
  changed_when: false

- name: Install official Puppet Agent package
  ansible.builtin.apt:
    name: "{{ puppet_agent_package_name | default('puppet-agent') }}"
    state: present
    lock_timeout: "{{ apt_lock_timeout | default(300) }}"
  register: puppet_agent_pkg_install

- name: Verify installed Puppet Agent binary path and executable status
  ansible.builtin.stat:
    path: "{{ puppet_bin_dir | default('/opt/puppetlabs/bin') }}/puppet"
  register: puppet_binary_stat
  failed_when: not puppet_binary_stat.stat.exists or not puppet_binary_stat.stat.executable

- name: Verify installed Puppet Agent version
  ansible.builtin.command:
    cmd: "{{ puppet_bin_dir | default('/opt/puppetlabs/bin') }}/puppet --version"
  register: puppet_version_output
  changed_when: false
